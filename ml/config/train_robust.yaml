# Production-oriented runner detector training profile.
# Paths are resolved relative to this file by ml/train.py.
schema_version: 1

model: yolo11n.pt
data: ../../data/public_runner_v1/runner_v1.yaml
project: ../runs
name: runner_yolo11n_robust

train:
  epochs: 75
  imgsz: 640
  batch: 8
  workers: 4
  device: null
  pretrained: true
  single_cls: true
  optimizer: AdamW
  lr0: 0.0015
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: true
  patience: 30
  seed: 42
  deterministic: true
  amp: true
  cache: false
  val: true
  plots: true
  save: true
  save_period: 10
  exist_ok: false

  # Drone viewpoint and outdoor illumination variation.
  hsv_h: 0.015
  hsv_s: 0.45
  hsv_v: 0.35
  degrees: 5.0
  translate: 0.12
  scale: 0.45
  shear: 2.0
  perspective: 0.0003
  fliplr: 0.5
  flipud: 0.0
  multi_scale: 0.15

  # Small/far runners and partial occlusion robustness.
  mosaic: 0.75
  mixup: 0.08
  cutmix: 0.12
  close_mosaic: 15

# Built in Python and passed through Ultralytics' custom augmentation API.
robust_augmentations:
  enabled: true
  blur:
    probability: 0.18
    motion_weight: 0.65
    motion_blur_limit: [3, 7]
    gaussian_blur_limit: [3, 5]
  partial_occlusion:
    probability: 0.16
    holes: [1, 3]
    height_fraction: [0.05, 0.18]
    width_fraction: [0.05, 0.18]
  wireless_compression:
    probability: 0.12
    quality: [55, 95]

evaluation:
  split_batch: 8
  workers: 4
  plots: true
  overfitting_thresholds:
    precision: 0.12
    recall: 0.12
    map50: 0.12
    map50_95: 0.10
